version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quantumshield_db
    environment:
      POSTGRES_USER: quantum_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: quantumshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
